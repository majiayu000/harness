[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for the Harness agent orchestration layer"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# Links harness-server so `harness serve` can run in-process.
# Omit it with `--no-default-features` to keep gc/rule/skill/plan/exec off the
# HTTP/workflow/Postgres/OTel server stack.
server = ["dep:harness-server"]

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-core = { workspace = true, features = ["db-postgres"] }
harness-protocol = { workspace = true }
harness-server = { workspace = true, optional = true }
harness-workflow = { workspace = true }
harness-agents = { workspace = true }
harness-gc = { workspace = true }
harness-rules = { workspace = true }
harness-skills = { workspace = true }
harness-exec = { workspace = true }
harness-observe = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
libc = "0.2"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tempfile = { workspace = true }
