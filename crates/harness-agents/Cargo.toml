[package]
name = "harness-agents"
version.workspace = true
edition.workspace = true
description = "Agent adapters (Claude Code, Codex) for the Harness orchestration layer"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Opt-in backend through the agent-runtime library. Path dependency on a local
# checkout during the trial; switch to a git dependency before pushing.
agent-runtime = ["dep:agent-runtime"]

[dependencies]
agent-runtime = { path = "../../../runtime/crates/agent-runtime", optional = true }
harness-core = { workspace = true }
harness-observe = { workspace = true }
harness-sandbox = { workspace = true }
tokio = { workspace = true, features = ["process", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
