[package]
name = "harness-agents"
version.workspace = true
edition.workspace = true
description = "Agent adapters (Claude Code, Codex) for the Harness orchestration layer"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Opt-in backend through the agent-runtime library (trial). agent-runtime is a
# private repository: resolving this workspace needs read access to it, even
# with the feature off, so this stays on its branch until that changes.
agent-runtime = ["dep:agent-runtime"]

[dependencies]
agent-runtime = { git = "https://github.com/majiayu000/agent-runtime.git", rev = "3d55a2292d184fff7bb152c238c944168e9a6ea8", optional = true }
harness-core = { workspace = true }
harness-observe = { workspace = true }
harness-sandbox = { workspace = true }
tokio = { workspace = true, features = ["process", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
