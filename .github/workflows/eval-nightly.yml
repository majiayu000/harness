name: Eval Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      gate_mode:
        description: Compare with the reviewed baseline or collect a report only
        required: true
        default: report-only
        type: choice
        options:
          - report-only
          - enforce
      refresh_baseline:
        description: Open a pull request that promotes a green candidate report
        required: true
        default: false
        type: boolean

concurrency:
  group: eval-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    if: ${{ vars.HARNESS_EVAL_ENABLED == 'true' }}
    runs-on: [self-hosted, harness-eval]
    environment: eval-nightly
    timeout-minutes: 360
    outputs:
      baseline-eligible: ${{ steps.eligibility.outputs.eligible }}
    env:
      HARNESS_EVAL_SERVER_URL: ${{ vars.HARNESS_EVAL_SERVER_URL }}
      HARNESS_EVAL_GATE_MODE: ${{ github.event.inputs.gate_mode || vars.HARNESS_EVAL_GATE_MODE || 'report-only' }}
      HARNESS_EVAL_MAX_TOTAL_TOKENS: ${{ vars.HARNESS_EVAL_MAX_TOTAL_TOKENS || '1000000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Build Harness CLI
        run: cargo build -p harness-cli

      - name: Preflight live eval infrastructure
        env:
          HARNESS_DATABASE_URL: ${{ secrets.HARNESS_DATABASE_URL }}
          HARNESS_API_TOKEN: ${{ secrets.HARNESS_API_TOKEN }}
        run: >-
          python3 scripts/preflight-eval-nightly.py
          --server-url "${HARNESS_EVAL_SERVER_URL:-http://127.0.0.1:9800}"
          --gate-mode "$HARNESS_EVAL_GATE_MODE"
          --manifest evals/benchmarks/harness-core.toml
          --baseline evals/baselines/harness-core/latest.json

      - name: Execute harness-core suite
        env:
          EVAL_RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          HARNESS_DATABASE_URL: ${{ secrets.HARNESS_DATABASE_URL }}
        run: >-
          target/debug/harness eval run
          --manifest evals/benchmarks/harness-core.toml
          --execute
          --run-id "$EVAL_RUN_ID"
          --max-total-tokens "$HARNESS_EVAL_MAX_TOTAL_TOKENS"
          --output "artifacts/eval/$EVAL_RUN_ID/report.json"
          --json

      - name: Locate candidate report
        id: candidate
        if: ${{ always() }}
        run: |
          report="$(find artifacts/eval -name report.json -type f -print -quit 2>/dev/null || true)"
          if [ -n "$report" ]; then
            echo "path=$report" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with reviewed baseline
        id: comparison
        if: ${{ steps.candidate.outputs.path != '' && hashFiles('evals/baselines/harness-core/latest.json') != '' }}
        continue-on-error: ${{ env.HARNESS_EVAL_GATE_MODE != 'enforce' }}
        run: >-
          target/debug/harness eval diff
          evals/baselines/harness-core/latest.json
          "${{ steps.candidate.outputs.path }}"
          --max-pass-drop 0.0
          --fail-on-new-f-gate
          --json
          --output artifacts/eval/diff.json

      - name: Determine baseline eligibility
        id: eligibility
        if: ${{ always() }}
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
          BASELINE_PRESENT: ${{ hashFiles('evals/baselines/harness-core/latest.json') != '' }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          if python3 scripts/check-eval-baseline-eligibility.py \
            --report "$CANDIDATE_PATH" \
            --baseline-present "$BASELINE_PRESENT" \
            --comparison-outcome "$COMPARISON_OUTCOME"
          then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            if [ "$HARNESS_EVAL_GATE_MODE" = "enforce" ]; then
              exit 1
            fi
          fi

      - name: Upload eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-core-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/eval/
          if-no-files-found: warn
          retention-days: 30

  refresh-baseline:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.refresh_baseline && needs.eval.result == 'success' && needs.eval.outputs.baseline-eligible == 'true' }}
    needs: eval
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download green candidate report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: harness-core-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/eval

      - name: Stage reviewed baseline proposal
        run: |
          report="$(find artifacts/eval -name report.json -type f -print -quit)"
          test -n "$report"
          day="$(date -u +%F)"
          mkdir -p evals/baselines/harness-core/history
          cp "$report" evals/baselines/harness-core/latest.json
          cp "$report" "evals/baselines/harness-core/history/${day}-${GITHUB_RUN_ID}.json"

      - name: Open baseline refresh pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          branch: eval-baseline/harness-core-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(eval): refresh harness-core baseline"
          title: "chore(eval): refresh harness-core baseline"
          body: |
            Promote the green report from Eval Nightly run ${{ github.run_id }}.

            The committed report remains subject to normal review before merge.
