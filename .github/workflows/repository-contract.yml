name: Repository Contract

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install trusted test dependency
        run: python3 -I -m pip install --disable-pip-version-check 'pytest==9.0.3'
      - name: Run trusted repository contract
        working-directory: trusted
        env:
          HARNESS_CONTRACT_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          PYTHONPATH: ""
          PYTEST_ADDOPTS: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_PLUGINS: ""
        run: python3 -I -m pytest -q -c /dev/null --noconftest -p no:cacheprovider tests --junitxml="${RUNNER_TEMP}/repository-contract.xml"
      - name: Verify trusted test execution
        env:
          HARNESS_CONTRACT_REPORT: ${{ runner.temp }}/repository-contract.xml
        run: |
          python3 -I - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["HARNESS_CONTRACT_REPORT"])
          if not report.is_file():
              raise SystemExit("trusted repository-contract report is missing")
          root = ET.parse(report).getroot()
          cases = {
              (case.attrib.get("classname", ""), case.attrib.get("name", ""))
              for case in root.iter("testcase")
          }
          expected_count = 96
          if len(cases) != expected_count:
              raise SystemExit(
                  f"trusted repository-contract count is {len(cases)}, expected {expected_count}"
              )
          required = {
              ("test_ci_contract", "test_scoped_ci_pipeline_contract"),
              (
                  "test_ci_trust_boundary",
                  "test_candidate_contract_implementation_matches_trusted_base",
              ),
              (
                  "test_ci_trust_boundary",
                  "test_isolated_pip_ignores_repository_package",
              ),
              (
                  "test_task_event_liveness",
                  "test_liveness_audit_cli_returns_nonzero_for_limbo",
              ),
          }
          missing = sorted(required - cases)
          if missing:
              raise SystemExit(f"trusted repository-contract nodes are missing: {missing}")
          failed = [
              case.attrib.get("name", "")
              for case in root.iter("testcase")
              if any(case.find(outcome) is not None for outcome in ("failure", "error", "skipped"))
          ]
          if failed:
              raise SystemExit(f"trusted repository-contract nodes did not pass: {failed}")
          PY
