name: Repository Contract

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HARNESS_CONTRACT_TRUST_ROTATION: ${{ contains(github.event.pull_request.labels.*.name, 'repository-contract-update') }}
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install trusted test dependency
        run: python3 -I -m pip install --disable-pip-version-check 'pytest==9.0.3'
      - name: Record maintainer-authorized trust rotation
        if: env.HARNESS_CONTRACT_TRUST_ROTATION == 'true'
        run: echo "::notice::Protected repository-contract files may change under the repository-contract-update label"
      - name: Collect trusted repository contract
        working-directory: trusted
        env:
          PYTHONPATH: ""
          PYTEST_ADDOPTS: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_PLUGINS: ""
        run: python3 -I -m pytest -q -c /dev/null --noconftest -p no:cacheprovider tests --collect-only > "${RUNNER_TEMP}/repository-contract.collection"
      - name: Run trusted repository contract
        working-directory: trusted
        env:
          HARNESS_CONTRACT_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          PYTHONPATH: ""
          PYTEST_ADDOPTS: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_PLUGINS: ""
        run: python3 -I -m pytest -q -c /dev/null --noconftest -p no:cacheprovider tests --junitxml="${RUNNER_TEMP}/repository-contract.xml"
      - name: Verify trusted test execution
        working-directory: trusted
        env:
          HARNESS_CONTRACT_REPORT: ${{ runner.temp }}/repository-contract.xml
          HARNESS_CONTRACT_COLLECTION: ${{ runner.temp }}/repository-contract.collection
        run: python3 -I scripts/verify_repository_contract.py
